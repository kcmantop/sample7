server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticketing_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30       # 커넥션 풀 개수 증가
      connection-timeout: 3000   # 커넥션 획득 실패 시 3초 후 예외 발생 (무한 대기 방지)				
  
logging:
  file:
    name: logs/application.log # 👈 로그 파일 저장 경로 및 파일명 지정
  level:
    com.zaxxer.hikari: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE			

data:
  redis:
  host: localhost
  port: 6379 # Redis 기본 포트 지정

jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

jwt:
  secret: c3VwZXItc2VjcmV0LWtleS13aXRoLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmc=
  expiration: 86400000 # 24시간 (ms 단위)