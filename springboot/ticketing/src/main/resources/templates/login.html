<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - 티켓 예매 시스템</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { width: 300px; margin: 0 auto; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>로그인</h2>
    <input type="email" id="email" placeholder="이메일 입력" required>
    <input type="password" id="password" placeholder="비밀번호 입력" required>
    <button onclick="login()">로그인</button>
    <p><a href="/view/signup">회원가입 하러가기</a></p>
</div>

<script>
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('accessToken', data.accessToken);
            alert('로그인 성공!');
            window.location.href = '/view/queue/1'; // 테스트용 1번 공연 대기열로 이동
        } else {
            alert('로그인 실패! 이메일과 비밀번호를 확인해주세요.');
        }
    }
</script>
</body>
</html>
